<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cotizador Tercio Creativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400..700&family=Marcellus&display=swap" rel="stylesheet">
<meta name="theme-color" content="#4A2E1C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="api-config.js"></script>
<style>
:root{
  --paper:#F3ECE2; --sheet:#FFFCF7; --field:#FFFFFF; --ink:#43291A; --ink-2:#7A5F4C; --line:#E2D3C1; --soft:#F8F1E7;
  --cyan:#8A5A32; --magenta:#C24A12; --yellow:#F0A11A; --key:#4A2E1C; --ok:#3F7D3A; --bad:#B42318;
  --orange:#E0601E; --amber:#F2A31B; --gold:#F7BC3A; --on-primary:#FFFFFF;
  --display:"Marcellus","Cormorant Garamond",Georgia,serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C140E; --sheet:#271D16; --field:#20170F; --ink:#F4EADF; --ink-2:#C9B4A0; --line:#45352A; --soft:#30251C;
    --cyan:#D9A26B; --magenta:#F07A3A; --yellow:#F5B342; --key:#F4EADF; --ok:#7CC47A; --bad:#F97066; color-scheme:dark;
    --orange:#F07A3A; --amber:#F5B342; --gold:#F8C75A; --on-primary:#1C140E;
  }
}
:root[data-theme="dark"]{
  --paper:#1C140E; --sheet:#271D16; --field:#20170F; --ink:#F4EADF; --ink-2:#C9B4A0; --line:#45352A; --soft:#30251C;
  --cyan:#D9A26B; --magenta:#F07A3A; --yellow:#F5B342; --key:#F4EADF; --ok:#7CC47A; --bad:#F97066; color-scheme:dark;
  --orange:#F07A3A; --amber:#F5B342; --gold:#F8C75A; --on-primary:#1C140E;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.gate{max-width:440px;margin:36px auto;overflow:hidden}
.gate.wide{max-width:760px}
.gate h3{font-size:15px;margin:6px 0 10px}
.gate-emb{width:58px;height:58px;display:block;margin-bottom:10px;color:var(--key)}
.who{display:flex;flex-direction:column;line-height:1.15;font-size:13px;text-align:right;white-space:nowrap}
.who small{color:var(--ink-2);font-size:11px;letter-spacing:.04em}
.steps{padding-left:18px;color:var(--ink-2)}
.okbox{margin-top:16px;padding:12px;border-radius:8px;background:var(--soft);border:1px solid var(--line)}
.okbox textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:12px;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink)}
code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:.92em}
@media (max-width:720px){.who{display:none}}

.draft-tag{font-family:"Jost",sans-serif;font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--ink-2);background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:3px 10px;vertical-align:middle}
.blocked{background:color-mix(in srgb,var(--bad) 9%,var(--sheet));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.blocked b{color:var(--bad)}
.neg{color:var(--bad)}
.line-out .neg b{color:var(--bad);font-size:15px}
.zrow{margin-bottom:10px}
.zctl{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:2px 0 4px}
.zctl .f{min-width:150px;max-width:220px}
label.btn{cursor:pointer}
.mock{border:1px solid var(--line);border-radius:10px;background:var(--soft);overflow:hidden}
.mock-tabs{display:flex;gap:4px;padding:8px 8px 0;flex-wrap:wrap}
.mock-tabs:empty{display:none}
.mock-tabs button{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2);font-family:inherit}
.mock-tabs button.on{background:var(--key);color:var(--sheet);border-color:var(--key)}
.mock-tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--orange);color:#fff;font-size:11px;line-height:18px;text-align:center}
.mock-stage{display:flex;justify-content:center;padding:10px}
.mock-stage svg{width:100%;max-width:520px;max-height:460px;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.art{cursor:move}.art .hdl{cursor:nwse-resize;opacity:0}.art.on .hdl,.art:hover .hdl{opacity:1}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swc{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);cursor:pointer;box-shadow:inset 0 0 0 2px var(--sheet);padding:0}
.swc.on{outline:2px solid var(--orange);outline-offset:2px}
.f .sw input[type=color]{width:36px!important;min-height:30px;height:30px;padding:0 2px;border-radius:6px}
.dtfbox{margin-top:10px}
.dtfgrid{display:grid;gap:10px}
.dtfrow{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;font-size:14px;background:var(--soft);border-radius:8px;padding:10px 12px}
.sheetsvg{width:96px;height:auto;display:block}
.dtftot{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.dtftot b{font-size:18px}
.t select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--field);min-height:34px}

body.shared nav,body.shared #sync,body.shared #btnLogout{display:none!important}
.share-doc{max-width:900px;margin:0 auto}
.share-doc .who{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}
.share-doc .who div{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:14px}
.share-doc .tots{margin-left:auto;max-width:340px;margin-top:14px}
@media (max-width:640px){.share-doc .who{grid-template-columns:1fr}}
.linkbox{display:flex;gap:8px;margin:12px 0}
.linkbox input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);font-size:13px}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand b{display:block;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.05;letter-spacing:.03em;text-transform:uppercase;color:var(--key)}
.brand small{display:block;color:var(--ink-2);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;margin-top:3px}
.emblem{width:42px;height:42px;flex:none;color:var(--key)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,var(--orange),var(--amber) 55%,var(--gold))}
.mark{display:grid;grid-template-columns:repeat(2,9px);gap:2px}
.mark i{width:9px;height:9px;display:block}
.mark i:nth-child(1){background:var(--cyan)}.mark i:nth-child(2){background:var(--magenta)}.mark i:nth-child(3){background:var(--yellow)}.mark i:nth-child(4){background:var(--key)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
nav a{padding:9px 12px;color:var(--ink-2);text-decoration:none;font-weight:600;white-space:nowrap;border-radius:6px}
nav a:hover{color:var(--ink);background:var(--soft)}
nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--magenta);border-radius:6px 6px 0 0}
.sync{font-size:12px;color:var(--ink-2);white-space:nowrap}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--yellow);margin-right:6px;vertical-align:1px}
.sync.cloud::before{background:var(--ok)}
@media (max-width:720px){.top{flex-wrap:wrap;gap:8px;padding:8px 14px}.sync{display:none}nav{order:3;flex-basis:100%}}

main{max-width:1260px;margin:0 auto;padding:22px 20px 90px}
h1{font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.01em;line-height:1.1;margin:0 0 6px;color:var(--key)}
h2{font-size:17px;font-weight:700;margin:0 0 12px}
h3{font-size:15px;font-weight:700;margin:0 0 8px}
.lede{color:var(--ink-2);margin:0 0 20px;max-width:70ch}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}

.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.panel>h2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--ink-2)}
.small{font-size:13px}

/* campos */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.f input,.f select,.f textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);min-height:40px}
.f textarea{min-height:64px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 22%,transparent)}
.f .hint{font-size:12px;color:var(--ink-2);font-weight:400}
.f.req>span:first-child::after{content:" *";color:var(--magenta)}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--magenta)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:7px;border:1px solid var(--line);background:var(--sheet);font-weight:650;cursor:pointer;min-height:40px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--magenta);border-color:var(--magenta);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.dark{background:var(--key);border-color:var(--key);color:var(--sheet)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--soft)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2);border-right:1px solid var(--line)}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--key);color:var(--sheet)}
.seg input:focus-visible+span{outline:2px solid var(--cyan);outline-offset:-2px}

/* cotizar */
.cot{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:22px;align-items:start}
@media (max-width:1000px){.cot{grid-template-columns:1fr}}
.svc-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.svc-pick button{text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:10px 12px;cursor:pointer;border-top:4px solid var(--c)}
.svc-pick button:hover{background:var(--soft)}
.svc-pick b{display:block;font-size:14px}
.svc-pick small{display:block;color:var(--ink-2);font-size:12px;line-height:1.35;margin-top:2px}

.item{background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:16px 16px 12px;margin-bottom:14px}
.item-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.item-h .tag{font-family:var(--display);font-weight:400;font-size:21px;flex:1;min-width:180px;color:var(--key)}
.item-h select{max-width:240px}
.sub{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.ubic{display:grid;grid-template-columns:minmax(110px,1.4fr) 1fr 1fr 90px 36px;gap:8px;align-items:end;margin-bottom:6px}
.ubic .area{font-size:13px;color:var(--ink-2);padding-bottom:10px}
@media (max-width:560px){.ubic{grid-template-columns:1fr 1fr 36px}.ubic .uname{grid-column:1/-1}.ubic .area{display:none}}
.iconbtn{width:36px;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);cursor:pointer;color:var(--ink-2);font-size:18px;line-height:1}
.iconbtn:hover{color:var(--bad)}
.line-out{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);align-items:baseline}
.line-out div{font-size:12.5px;color:var(--ink-2)}
.line-out b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.line-out .big b{font-size:20px;font-stretch:85%}
details.costs{margin-top:8px;font-size:13px}
details.costs summary{cursor:pointer;color:var(--ink-2);font-weight:600}
details.costs table{margin-top:6px}

/* prueba de color: el resumen */
.proof{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px)}
.sheet{position:relative;background:var(--sheet);border:1px solid var(--line);padding:22px 22px 18px;margin:12px}
.crop{position:absolute;width:14px;height:14px;border-color:var(--ink-2);border-style:solid;border-width:0}
.crop.tl{top:-12px;left:-12px;border-right-width:1px;border-bottom-width:1px}
.crop.tr{top:-12px;right:-12px;border-left-width:1px;border-bottom-width:1px}
.crop.bl{bottom:-12px;left:-12px;border-right-width:1px;border-top-width:1px}
.crop.br{bottom:-12px;right:-12px;border-left-width:1px;border-top-width:1px}
.sheet .emb{display:block;width:34px;height:34px;color:var(--key);margin-bottom:10px}
.wave{display:block;width:calc(100% + 44px);height:46px;margin:16px -22px -18px}
.qnum{font-weight:600;font-size:13px;letter-spacing:.12em;color:var(--magenta)}
.qcli{font-weight:700;font-size:16px;margin:2px 0 12px;overflow-wrap:anywhere}
.qlines{list-style:none;margin:0 0 14px;padding:0;font-size:13.5px}
.qlines li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.qlines li span:first-child{overflow-wrap:anywhere}
.tot{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.grand{margin-top:8px;padding-top:10px;border-top:2px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.grand b{font-family:var(--display);font-weight:400;font-size:36px;line-height:1;color:var(--key);font-variant-numeric:tabular-nums}
.internal{margin-top:12px;padding:10px;border-radius:6px;background:var(--soft);font-size:13.5px}
.internal .tot b.pos{color:var(--ok)}.internal .tot b.neg{color:var(--bad)}
.proof .btns{margin:6px 12px 0}
.proof .btns .btn{flex:1 1 140px}

/* tablas */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12.5px;color:var(--ink-2);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t td.r,.t th.r{text-align:right}
.t tr:hover td{background:var(--soft)}
.t input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--field);min-height:34px}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:650;background:var(--soft);border:1px solid var(--line);margin:1px 3px 1px 0;white-space:nowrap}
.st{font-weight:650;font-size:13px;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--field)}
.st[data-v="aprobada"],.st[data-v="facturada"]{color:var(--ok)}
.st[data-v="rechazada"]{color:var(--bad)}
.st[data-v="enviada"]{color:var(--cyan)}
.empty{padding:36px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.toolbar .f{min-width:180px}

/* panel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--sheet);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.kpi{padding:16px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi small{display:block;color:var(--ink-2);font-size:12.5px;font-weight:600}
.kpi b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--key);line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi em{font-style:normal;font-size:12.5px;color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--ink-2);font-size:11px;font-family:inherit}
.chart .gl{stroke:var(--line)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(110px,170px) 1fr auto;gap:8px 10px;align-items:center;font-size:13.5px}
.hb .bar{height:12px;background:var(--soft);border-radius:3px;overflow:hidden}
.hb .bar i{display:block;height:100%}
.hb .v{font-variant-numeric:tabular-nums;font-weight:650;text-align:right}

/* ajustes */
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.rates div{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.rates b{display:block;color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.savebar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:flex-end;gap:8px;padding:10px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(10,20,40,.12)}
.savebar .msg{margin-right:auto;align-self:center;font-size:13px;color:var(--ink-2)}

dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--sheet);color:var(--ink);width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(8,14,28,.55)}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--sheet);z-index:1}
.dlg-b{padding:18px 20px}
.dlg-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--sheet)}
.err{color:var(--bad);font-size:13px;margin-top:8px}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%) translateY(20px);background:var(--key);color:var(--sheet);padding:11px 16px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 30px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

#printDoc{display:none}
@media print{
  body{background:#fff;color:#000}
  body::before{display:none}

const num = v=>{const x=parseFloat(String(v??"").replace(/\./g,"").replace(",","."));return isFinite(x)?x:0;};
const numIn = v=>{if(typeof v==="number")return isFinite(v)?v:0;let s=String(v??"").trim().replace(/\s|\$/g,"");if(!s)return 0;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(",",".");
  const x=parseFloat(s);return isFinite(x)?x:0;};
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = ()=>(crypto.randomUUID?crypto.randomUUID().replace(/-/g,"").slice(0,20):Date.now().toString(36)+Math.random().toString(36).slice(2,12));
const clone = o=>JSON.parse(JSON.stringify(o));

const addDays = (iso,d)=>{const t=new Date(iso);t.setDate(t.getDate()+(+d||0));return t.toISOString();};
function merge(base,over){const out=clone(base);if(!over||typeof over!=="object")return out;
  for(const k of Object.keys(over)){const v=over[k];
    if(v&&typeof v==="object"&&!Array.isArray(v)&&out[k]&&typeof out[k]==="object"&&!Array.isArray(out[k]))out[k]=merge(out[k],v);else out[k]=v;}
  return out;}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),3200);}
function dvNit(n){const w=[3,7,13,17,19,23,29,37,41,43,47,53,59,67,71];const d=String(n).replace(/\D/g,"").split("").reverse();
  if(!d.length)return"";let s=0;d.forEach((x,i)=>{s+=(+x)*(w[i]||0);});const r=s%11;return String(r>1?11-r:r);}

/* ============================================================

const LS_KEY = "tercio_cotizador_v1";
const state = {settings:clone(DEFAULTS),clientes:[],cotizaciones:[],mode:"local"};
let db=null, downloads=null, draft=null, settingsDraft=null, settingsDirty=false, showInternal=true;
let sb=null, sbUser=null, needsLogin=false, inClaude=false;

function loadLocal(){try{const raw=localStorage.getItem(LS_KEY);if(!raw)return;const d=JSON.parse(raw);
  state.settings=merge(DEFAULTS,d.settings);if(Array.isArray(d.settings?.productos))state.settings.productos=d.settings.productos;if(Array.isArray(d.settings?.sustratos))state.settings.sustratos=d.settings.sustratos;
  state.clientes=d.clientes||[];state.cotizaciones=d.cotizaciones||[];}catch(e){}}
function saveLocal(){if(state.mode!=="local")return;try{localStorage.setItem(LS_KEY,JSON.stringify({settings:state.settings,clientes:state.clientes,cotizaciones:state.cotizaciones}));}catch(e){toast("No se pudo guardar en este navegador.");}}

async function persist(kind,obj,del){
  const coll={cliente:"clientes",cotizacion:"cotizaciones"}[kind];
  if(state.mode==="sheets")return apiPersist(kind,obj,del);
  if(state.mode==="supabase"&&sb){
    const table=kind==="ajustes"?"config":coll;const id=kind==="ajustes"?"ajustes":obj.id;
    try{
      const r=del?await sb.from(table).delete().eq("id",id):await sb.from(table).upsert({id,data:clone(obj),updated_at:new Date().toISOString()});
      if(r.error)throw r.error;
    }catch(e){toast("No se pudo guardar en la nube: "+(e&&e.message?e.message:"revisa la conexión"));return false;}
    applyLocal(kind,obj,del,coll);return true;
  }
  if(state.mode==="db"&&db){
    try{
      if(kind==="ajustes"){await db.doc("config/ajustes").set(clone(obj));}
      else if(del){await db.collection(coll).doc(obj.id).delete();}
      else{await db.collection(coll).doc(obj.id).set(clone(obj));}
      return true;
    }catch(e){toast(e&&e.code==="quota_exceeded"?"La base de datos está llena: elimina cotizaciones antiguas.":"No se pudo guardar. Revisa tu permiso de edición e intenta de nuevo.");return false;}
  }
  applyLocal(kind,obj,del,coll);saveLocal();return true;
}
function applyLocal(kind,obj,del,coll){
  if(kind==="ajustes"){state.settings=clone(obj);return;}
  const arr=state[coll];const i=arr.findIndex(x=>x.id===obj.id);
  if(del){if(i>=0)arr.splice(i,1);}else if(i>=0)arr[i]=clone(obj);else arr.push(clone(obj));
}

function sbConfig(){
  if(SUPABASE_URL&&SUPABASE_ANON_KEY)return {url:SUPABASE_URL,key:SUPABASE_ANON_KEY,fixed:true};
  try{const c=JSON.parse(localStorage.getItem("tc_sb_cfg")||"null");if(c&&c.url&&c.key)return c;}catch(e){}
  return null;
}
function connect(){
  if(!inClaude){startSheets();return;}
  window.claude.use("downloads").then(d=>{downloads=d;}).catch(()=>{});
  window.claude.use("db").then(d=>{
    if(!d)return;db=d;state.mode="db";
    const s=$("#sync");s.textContent="Guardado en la nube";s.classList.add("cloud");
    let first={c:true,q:true,a:true};
    const onErr=()=>{};
    db.collection("clientes").onSnapshot(snap=>{state.clientes=snap.docs.map(x=>({...x.data(),id:x.id}));first.c=false;refreshFromData();},onErr);
    db.collection("cotizaciones").onSnapshot(snap=>{state.cotizaciones=snap.docs.map(x=>({...x.data(),id:x.id}));first.q=false;refreshFromData();},onErr);
    db.doc("config/ajustes").onSnapshot(snap=>{
      if(snap.exists){const d=snap.data();state.settings=merge(DEFAULTS,d);if(Array.isArray(d.productos))state.settings.productos=d.productos;}
      else state.settings=clone(DEFAULTS);
      if(!settingsDirty)settingsDraft=null;
      refreshFromData();},onErr);
  }).catch(()=>{});
}

/* ---------- Supabase: base de datos compartida fuera de Claude ---------- */
async function fetchAll(table){
  let out=[],from=0;
  for(;;){const {data,error}=await sb.from(table).select("id,data").range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000;}
  return out;
}
async function startSupabase(cfg){
  if(!window.supabase||!window.supabase.createClient){needsLogin=false;toast("No cargó la conexión a la nube. Revisa internet y recarga la página.");render();return;}
  try{sb=window.supabase.createClient(cfg.url,cfg.key);}catch(e){sb=null;needsLogin=false;toast("La URL o la clave de la nube no son válidas. Corrígelas en Ajustes.");render();return;}
  needsLogin=true;setSync();render();
  try{const {data}=await sb.auth.getSession();if(data&&data.session)await enterCloud(data.session);}catch(e){}
  sb.auth.onAuthStateChange((ev)=>{
    if(ev==="SIGNED_OUT"){sbUser=null;needsLogin=true;state.mode="local";state.clientes=[];state.cotizaciones=[];draft=null;setSync();render();}
  });
}
async function enterCloud(session){
  sbUser=session.user;
  try{
    const [c,q,a]=await Promise.all([fetchAll("clientes"),fetchAll("cotizaciones"),sb.from("config").select("id,data").eq("id","ajustes").maybeSingle()]);
    if(a.error)throw a.error;
    state.clientes=c.map(r=>({...r.data,id:r.id}));state.cotizaciones=q.map(r=>({...r.data,id:r.id}));
    if(a.data&&a.data.data){state.settings=merge(DEFAULTS,a.data.data);if(Array.isArray(a.data.data.productos))state.settings.productos=a.data.data.productos;}
    else state.settings=clone(DEFAULTS);
  }catch(e){toast("No se pudieron leer los datos de la nube. Revisa que corriste el script SQL. "+(e&&e.message?e.message:""));return false;}
  state.mode="supabase";needsLogin=false;settingsDraft=null;settingsDirty=false;draft=null;setSync();
  if(!enterCloud.ch)enterCloud.ch=sb.channel("tercio").on("postgres_changes",{event:"*",schema:"public"},onRemote).subscribe();
  render();return true;
}
function onRemote(p){
  const t=p.table;const row=p.eventType==="DELETE"?p.old:p.new;if(!row||!row.id||state.mode!=="supabase")return;
  if(t==="config"){if(p.eventType==="DELETE"||!row.data)return;state.settings=merge(DEFAULTS,row.data);if(Array.isArray(row.data.productos))state.settings.productos=row.data.productos;if(!settingsDirty)settingsDraft=null;}
  else if(t==="clientes"||t==="cotizaciones"){const arr=state[t];const i=arr.findIndex(x=>x.id===row.id);
    if(p.eventType==="DELETE"){if(i>=0)arr.splice(i,1);}else{const v={...row.data,id:row.id};if(i>=0)arr[i]=v;else arr.push(v);}}
  else return;
  refreshFromData();
}
function setSync(){const s=$("#sync"),b=$("#btnLogout");
  if(state.mode==="supabase"){s.textContent="En la nube: "+(sbUser&&sbUser.email?sbUser.email:"");s.classList.add("cloud");b.hidden=false;}
  else if(state.mode==="db"){s.textContent="Guardado en la nube";s.classList.add("cloud");b.hidden=true;}
  else{s.textContent=sb?"Sin sesión iniciada":"Guardado en este navegador";s.classList.remove("cloud");b.hidden=true;}}
function renderLogin(){
  $$("#nav a").forEach(a=>a.setAttribute("aria-current","false"));

function derive(S){
  const minProd=S.jornada*52/12*S.eficiencia*60;
  const mo=S.nomina.costoTrabajador/minProd;
  const f=S.fijos;const A=S.aire||{};const aireMes=(+A.cantidad||0)*(+A.kw||0)*(+A.horas||0)*(+A.dias||0)*S.kwh;
  const indTotal=S.nomina.costoTrabajador*S.nomina.admin+f.arriendo+f.agua+f.energia+f.internet+f.siigo+(f.otros||0)+aireMes;
  const ind=indTotal/(minProd*Math.max(1,S.nomina.disenadores));
  const maq={},mant={};for(const k of Object.keys(S.maquinas)){const m=S.maquinas[k];mant[k]=m.valor*(+m.mant||0)/12;maq[k]=(m.valor/(S.vidaUtil*12)+mant[k])/minProd+m.kw*S.kwh/60;}
  const I=S.insumos;
  const tintaCm2=I.tintaLitro/1000*I.tintaMl/10000;
  const filmCm2=I.filmPrecio/(I.filmAncho*I.filmLargo*100*I.filmUtil);
  const camaArea=I.filmAncho*2*90*I.filmUtil;
  const dtfCm2=I.dtfMetro/(I.dtfAncho*(I.dtfLargo||100));
  return {minProd,mo,ind,indTotal,aireMes,maq,mant,tintaCm2,filmCm2,camaArea,dtfCm2};
}

  if(c.zonas.length)med.push(c.zonas.map(z=>`${z.n?z.n+" ":""}${fnum(z.an)} × ${fnum(z.al)} cm`).join(", "));
  if(L.svc==="impl"){const pq=papelById(L.papel);const tam=(pq&&pq.tam)||L.pTam||"carta";
    if(L.pModo==="pieza"){if(numIn(L.pzaAn)&&numIn(L.pzaAl))med.push(`${fnum(numIn(L.pzaAn))} × ${fnum(numIn(L.pzaAl))} cm`);}
    else{const d=HOJA_CM[tam];med.push(`${TAMANOS[tam]||tam}${d?` (${fnum(d[0],1)} × ${fnum(d[1],1)} cm)`:""}`);}
    det.push((pq?pq.nombre:"papel del cliente")+(L.pModo==="pieza"?` tamaño ${TAMANOS[tam]||tam}`:""));
    det.push(`${L.pColor==="bn"?"blanco y negro":"a color"}, ${String(L.pCaras)==="2"?"dos caras":"una cara"}`);
    if(L.pModo!=="pieza"){const h=Math.max(1,Math.round(numIn(L.pHojas)||1));if(h>1)det.push(`${h} hojas por unidad`);}
  }else{
    if(L.base==="nosotros"&&String(L.prod).startsWith("s:")){const x=sustratoById(L.prod.slice(2));if(x)det.push(x.nombre);
      if(numIn(L.pzAn)&&numIn(L.pzAl))med.unshift(`pieza ${fnum(numIn(L.pzAn))} × ${fnum(numIn(L.pzAl))} cm`);}
    else if(L.base==="nosotros"&&c.baseNombre)det.push(c.baseNombre);
    if(L.base==="cliente")det.push("producto del cliente");
    if(L.svc==="dtf"&&!L.usaDtf)det.push("sin film DTF");
    if(L.svc==="uvdtf"&&L.aplicar)det.push("aplicado sobre el producto");
    if(L.svc==="laser"&&numIn(L.corteM)>0)med.push(`corte de ${fnum(numIn(L.corteM),2)} m por unidad`);
    if(L.svc==="lam")med.push(`${fnum(numIn(L.lamM),2)} m lineales por unidad`);
  }
  const parts=[`Tipo de trabajo: ${sv.nombre}`];
  if(med.length)parts.push(`Medidas: ${med.join(", ")}`);
  if(det.length)parts.push(det.join(", "));
  if(L.detalle)parts.push(L.detalle);
  return parts.join(" · ");
}
function calcQuote(Q){
  const S=state.settings,D=derive(S);const mP=Math.min(0.95,numIn(Q.margen!==undefined?Q.margen:S.precios.margen));const mS=mP;
  const lines=Q.items.map(L=>({L,c:calcLine(normalizeLine(L),S,D,mP,mS)}));
  const subtotal=lines.reduce((s,x)=>s+x.c.subtotal,0);
  const costo=lines.reduce((s,x)=>s+x.c.costo,0);
  const disenos=lines.reduce((s,x)=>s+x.c.diseno,0);
  const errores=lines.filter(x=>x.c.err).length;
  const iva=S.precios.responsableIva?subtotal*S.precios.iva:0;
  return {lines,subtotal,costo,disenos,errores,iva,total:subtotal+iva,util:subtotal-costo,D};
}

function nextNumero(){if(state.mode==="sheets")return "COT-"+String(contador+1).padStart(4,"0");const n=state.cotizaciones.map(q=>parseInt(String(q.numero||"").replace(/\D/g,""),10)||0);return "COT-"+String((n.length?Math.max(...n):0)+1).padStart(4,"0");}
function buildQuoteRecord(){
  const R=calcQuote(draft);const cli=getClient(draft.clienteId);const now=new Date().toISOString();
  return {id:draft.id||uid(),numero:draft.numero||nextNumero(),fecha:draft.fecha||now,actualizado:now,
    clienteId:cli.id,cliente:clone(cli),estado:draft.estado,validez:numIn(draft.validez)||15,notas:draft.notas||"",
    margen:draft.margen,
    items:R.lines.map(({L,c})=>({...clone(L),calc:{q:c.q,area:c.area,prodUnit:c.prodUnit,servUnit:c.servUnit,unit:c.unit,diseno:c.diseno,dtfPlanchas:c.dtf?c.dtf.planchas:0,subtotal:c.subtotal,costo:c.costo,util:c.util,baseNombre:c.baseNombre},descripcion:describe(L,c)})),
    subtotal:R.subtotal,iva:R.iva,total:R.total,costo:R.costo,util:R.util,ivaPct:state.settings.precios.responsableIva?state.settings.precios.iva:0,
    empresa:clone(state.settings.empresa)};
}
async function saveDraft(quiet){
  if(!draft.items.length){toast("Agrega al menos un trabajo antes de guardar.");return false;}
  if(calcQuote(draft).errores){toast("Hay trabajos que no se pueden ejecutar. Corrígelos antes de guardar.");return false;}
  if(state.mode==="sheets"&&!draft.numero){try{draft.numero=await reserveNumero();}catch(e){toast("No se pudo asignar el número: "+apiErr(e));return false;}}
  const rec=buildQuoteRecord();
  const ok=await persist("cotizacion",rec);
  if(ok){draft.id=rec.id;draft.numero=rec.numero;draft.fecha=rec.fecha;refreshCalc();if(!quiet)toast(`Cotización ${rec.numero} guardada`);}
  return ok;
}
function loadIntoDraft(q,asCopy){
  draft={id:asCopy?null:q.id,numero:asCopy?null:q.numero,fecha:asCopy?null:q.fecha,clienteId:q.clienteId,
    items:q.items.map(it=>{const x=clone(it);delete x.calc;delete x.descripcion;if(asCopy)x.id=uid();return normalizeLine(x);}),
    margen:q.margen!==undefined?q.margen:state.settings.precios.margen,notas:q.notas,estado:asCopy?"borrador":q.estado,validez:q.validez};
  if(q.clienteId!=="cf"&&!state.clientes.some(c=>c.id===q.clienteId))draft.clienteId="cf";
  location.hash="#cotizar";if(currentView()==="cotizar")renderCotizar();
}

function openClientDialog(c,onSaved){

        <label class="f req"><span>Número de documento</span><input name="numDoc" value="${esc(x.numDoc)}" inputmode="numeric" autocomplete="off"></label>
        ${x.tipoDoc==="NIT"?`<label class="f"><span>Dígito de verificación</span><input name="dv" value="${esc(x.dv||dvNit(x.numDoc))}" inputmode="numeric" maxlength="1"><span class="hint">Se calcula solo; verifícalo con el RUT</span></label>`:""}
        <label class="f req" style="grid-column:1/-1"><span>${x.tipoPersona==="juridica"?"Razón social":"Nombres y apellidos"}</span><input name="nombre" value="${esc(x.nombre)}" autocomplete="off"></label>

        <label class="f ${el?"req":""}"><span>Correo electrónico</span><input name="correo" type="email" value="${esc(x.correo)}" autocomplete="off"><span class="hint">${el?"A este correo llega la factura electrónica":""}</span></label>
        <label class="f"><span>Teléfono</span><input name="telefono" value="${esc(x.telefono)}" inputmode="tel"></label>
        <label class="f ${el?"req":""}" style="grid-column:1/-1"><span>Dirección</span><input name="direccion" value="${esc(x.direccion)}"></label>
        <label class="f ${el?"req":""}"><span>Ciudad o municipio</span><input name="ciudad" value="${esc(x.ciudad)}"></label>
        <label class="f ${el?"req":""}"><span>Departamento</span><input name="departamento" value="${esc(x.departamento)}"></label>
        ${el?`<label class="f req"><span>Régimen de IVA</span><select name="regimen"><option value="no_responsable" ${x.regimen==="no_responsable"?"selected":""}>No responsable de IVA</option><option value="responsable" ${x.regimen==="responsable"?"selected":""}>Responsable de IVA</option></select></label>
        <label class="f req"><span>Responsabilidad fiscal (RUT casilla 53)</span><select name="responsabilidad">${Object.entries(RESP).map(([k,v])=>`<option value="${k}" ${x.responsabilidad===k?"selected":""}>${k} ${v}</option>`).join("")}</select></label>`:""}
      </div>
      <div class="err" id="cliErr" role="alert"></div>
    </div>
    <div class="dlg-f">${c&&isAdmin()?`<button class="btn ghost danger" type="button" id="cliDel">Eliminar cliente</button><span style="flex:1"></span>`:""}<button class="btn" type="button" id="dlgCancel">Cancelar</button><button class="btn primary" type="submit" id="cliOk">Guardar cliente</button></div>
  </form>`;};
  const read=()=>{const f=$("#cliForm");const fd=new FormData(f);x.tipoFactura=fd.get("tf")||x.tipoFactura;

    const ok=await persist("cliente",x);if(!ok)return;
    if(state.mode==="db"&&!state.clientes.some(c=>c.id===x.id))state.clientes.push(clone(x));
    dlg.close();toast(`${x.nombre} guardado`);onSaved&&onSaved(x);if(currentView()==="clientes")renderClientes();};

  const now=new Date();const from={mes:new Date(now.getFullYear(),now.getMonth(),1),tri:new Date(now.getFullYear(),now.getMonth()-2,1),anio:new Date(now.getFullYear(),0,1),todo:new Date(0)}[per];

function barChart(rows){
  const W=600,H=230,pl=64,pb=26,pt=10;const max=Math.max(1,...rows.map(r=>Math.max(r.cot,r.apr)));
  const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)));return Math.ceil(v/p)*p;};const top=nice(max);
  const gw=(W-pl-10)/rows.length;const bw=Math.min(28,gw/3);
  const y=v=>pt+(H-pt-pb)*(1-v/top);
  const short=v=>v>=1e6?fnum(v/1e6,1)+" M":v>=1e3?fnum(v/1e3,0)+" mil":fnum(v,0);
  let g="";for(let i=0;i<=4;i++){const v=top*i/4;g+=`<line class="gl" x1="${pl}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`;}
  const bars=rows.map((r,i)=>{const cx=pl+gw*i+gw/2;return `<rect x="${cx-bw-2}" y="${y(r.cot)}" width="${bw}" height="${H-pb-y(r.cot)}" fill="var(--cyan)" rx="2"><title>Cotizado ${fmt(r.cot)}</title></rect>
    <rect x="${cx+2}" y="${y(r.apr)}" width="${bw}" height="${H-pb-y(r.apr)}" fill="var(--magenta)" rx="2"><title>Vendido ${fmt(r.apr)}</title></rect>
    <text class="ax" x="${cx}" y="${H-8}" text-anchor="middle">${esc(r.label)}</text>`;}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Valor cotizado y vendido por mes">${g}${bars}</svg>`;
}

const b64u={enc(bytes){let s="";for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");},
  dec(str){const s=atob(str.replace(/-/g,"+").replace(/_/g,"/"));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}};
async function packShare(q){
  const E=q.empresa||state.settings.empresa,C=q.cliente||CONSUMIDOR_FINAL;
  const o={v:1,n:q.numero,f:q.fecha,va:q.validez,
    e:{nombre:E.nombre,nit:E.nit,direccion:E.direccion,ciudad:E.ciudad,telefono:E.telefono,correo:E.correo,notas:E.notas},
    c:{id:C.id==="cf"?"cf":"c",nombre:C.nombre,tipoDoc:C.tipoDoc,numDoc:C.numDoc,dv:C.dv,direccion:C.direccion,ciudad:C.ciudad,departamento:C.departamento,correo:C.correo,telefono:C.telefono,tipoFactura:C.tipoFactura,regimen:C.regimen,responsabilidad:C.responsabilidad},
    it:docRows(q).map(r=>[r.d,r.q,r.p,r.s,r.t]),s:q.subtotal,i:q.iva,ip:q.ivaPct,t:q.total,no:q.notas};
  const bytes=new TextEncoder().encode(JSON.stringify(o));
  if(window.CompressionStream){try{const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));return "z"+b64u.enc(new Uint8Array(await new Response(st).arrayBuffer()));}catch(e){}}
  return "j"+b64u.enc(bytes);
}
async function unpackShare(code){
  let bytes=b64u.dec(code.slice(1));
  if(code[0]==="z"){if(!window.DecompressionStream)throw new Error("navegador");const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));bytes=new Uint8Array(await new Response(st).arrayBuffer());}
  const o=JSON.parse(new TextDecoder().decode(bytes));
  return {numero:o.n,fecha:o.f,validez:o.va,empresa:o.e,cliente:o.c,notas:o.no,subtotal:o.s,iva:o.i,ivaPct:o.ip,total:o.t,
    items:o.it.map(a=>({descripcion:a[0],calc:{q:a[1],prodUnit:a[2],servUnit:a[3],subtotal:a[4]}}))};
}

function exportBackup(){
  const d={app:"cotizador-tercio-creativo",version:1,fecha:new Date().toISOString(),settings:state.settings,clientes:state.clientes,cotizaciones:state.cotizaciones};
  saveFile(`respaldo-tercio-creativo-${d.fecha.slice(0,10)}.json`,new Blob([JSON.stringify(d)],{type:"application/json"}));
}
async function bulkUpload(d,label){
  let n=0;
  if(d.settings){const s=merge(DEFAULTS,d.settings);if(Array.isArray(d.settings.productos))s.productos=d.settings.productos;if(await persist("ajustes",s))n++;}
  for(const c of d.clientes||[]){if(c&&c.id&&await persist("cliente",c))n++;}
  for(const q of d.cotizaciones||[]){if(q&&q.id&&await persist("cotizacion",q))n++;}
  settingsDraft=null;settingsDirty=false;toast(`${label}: ${n} registros`);render();
}
function importBackup(file){
  if(!file)return;const r=new FileReader();
  r.onload=async()=>{let d;try{d=JSON.parse(r.result);}catch(e){toast("El archivo no es un respaldo válido.");return;}
    if(!d||(!Array.isArray(d.clientes)&&!Array.isArray(d.cotizaciones))){toast("El archivo no es un respaldo del cotizador.");return;}
    if(!confirm(`Se restaurarán ${(d.clientes||[]).length} clientes y ${(d.cotizaciones||[]).length} cotizaciones, y se reemplazarán los ajustes. Los registros repetidos se sobrescriben. ¿Continuar?`))return;
    await bulkUpload(d,"Respaldo restaurado");};
  r.readAsText(file);
}
async function migrateLocal(){
  let d=null;try{d=JSON.parse(localStorage.getItem(LS_KEY)||"null");}catch(e){}
  if(!d||(!(d.clientes||[]).length&&!(d.cotizaciones||[]).length)){toast("Este navegador no tiene datos guardados para subir.");return;}
  if(!confirm(`Se subirán a la nube ${(d.clientes||[]).length} clientes, ${(d.cotizaciones||[]).length} cotizaciones y los ajustes de este navegador. ¿Continuar?`))return;
  await bulkUpload(d,"Datos subidos");
}
function exportCSV(list){
  if(!list.length){toast("No hay cotizaciones en el periodo para exportar.");return;}
  const head=["Número","Fecha","Estado","Cliente","Documento","Tipo de factura","Trabajos","Subtotal","IVA","Total","Costo","Utilidad"];
  const rows=list.map(c=>[c.numero,new Date(c.fecha).toISOString().slice(0,10),ESTADOS[c.estado]||c.estado,c.cliente?.nombre,docLabel(c.cliente),c.cliente?.tipoFactura==="electronica"?"Electrónica":"POS",
    [...new Set((c.items||[]).map(i=>SERVICIOS[i.svc]?.nombre))].join(" / "),Math.round(c.subtotal),Math.round(c.iva),Math.round(c.total),Math.round(c.costo),Math.round(c.util)]);
  const csv=[head,...rows].map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\r\n");
  saveFile("cotizaciones-tercio-creativo.csv",new Blob(["\ufeff"+csv],{type:"text/csv"}));
}

/* ============================================================
   GOOGLE SHEETS: inicio de sesión, roles y datos en Google Drive
   ============================================================ */
let nube=null,perfil=null,gate={paso:"cargando"},contador=0,publico=null,pollT=null,ultimaFirma="";
const isAdmin=()=>!nube||(perfil&&perfil.rol==="admin");
const URL_OK=/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec\/?$/;
function apiUrl(){const w=window.TERCIO_API;if(w&&URL_OK.test(w))return w;try{const c=localStorage.getItem("tc_api");if(c&&URL_OK.test(c))return c;}catch(e){}return null;}
function token(){try{return localStorage.getItem("tc_token")||"";}catch(e){return"";}}
function setToken(t){try{t?localStorage.setItem("tc_token",t):localStorage.removeItem("tc_token");}catch(e){}}
async function api(action,data={},conToken=true){
  const url=nube||apiUrl();if(!url)throw new Error("Falta la dirección de la base de datos.");
  let r;
  try{r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...data,action,token:conToken?token():undefined}),redirect:"follow"});}
  catch(e){throw new Error("Sin conexión con Google Sheets. Revisa internet e intenta de nuevo.");}
  let j;try{j=await r.json();}catch(e){throw new Error("Google Sheets no respondió como se esperaba. Revisa que la aplicación web esté implementada con acceso para Cualquier persona.");}
  if(!j.ok){if(conToken&&/Sesión vencida/.test(j.error||""))logoutLocal("Tu sesión venció. Ingresa de nuevo.");throw new Error(j.error||"Error en la base de datos.");}
  return j;}
const apiErr=e=>(e&&e.message)||"Ocurrió un error.";
function setWho(){const w=$("#who"),b=$("#btnLogout"),p=$("#btnPwd"),s=$("#sync");
  if(state.mode==="sheets"&&perfil){w.hidden=false;w.innerHTML=`<b>${esc(perfil.nombre||perfil.email)}</b><small>${perfil.rol==="admin"?"Administrador":"Empleado"}</small>`;b.hidden=false;p.hidden=false;s.textContent="Google Sheets";s.classList.add("cloud");}
  else{w.hidden=true;b.hidden=true;p.hidden=true;}
  $$("#nav a[data-admin]").forEach(a=>a.hidden=!isAdmin());
  $("#nav").hidden=!!needsLogin;}
function logoutLocal(msg){setToken("");clearInterval(pollT);perfil=null;state.mode="local";state.clientes=[];state.cotizaciones=[];state.usuarios=[];draft=null;
  needsLogin=true;gate={paso:"login",msg:msg||""};setWho();render();}
async function startSheets(){
  needsLogin=true;const url=apiUrl();if(!url){gate={paso:"config"};render();return;}
  nube=url;gate={paso:"cargando"};render();
  try{const e=await api("estado",{},false);publico={empresa:e.empresa};
    if(!e.configurado){gate={paso:"admin"};render();return;}
    if(!token()){gate={paso:"login"};render();return;}
    await cargarNube(true);
  }catch(x){if(!token()&&gate.paso==="login")return;gate={paso:"error",msg:apiErr(x)};render();}
}
async function cargarNube(primera){
  const r=await api("cargar");
  const firma=JSON.stringify([r.clientes,r.cotizaciones,r.usuarios,r.ajustes,r.contador,r.perfil]);
  if(!primera&&firma===ultimaFirma)return;ultimaFirma=firma;
  perfil=r.perfil;contador=+r.contador||0;
  state.clientes=r.clientes||[];state.cotizaciones=r.cotizaciones||[];state.usuarios=r.usuarios||[];
  if(r.ajustes){state.settings=merge(DEFAULTS,r.ajustes);for(const k of["productos","sustratos","papeles"])if(Array.isArray(r.ajustes[k]))state.settings[k]=r.ajustes[k];}
  if(primera){state.mode="sheets";needsLogin=false;draft=null;settingsDraft=null;settingsDirty=false;if(!isAdmin())showInternal=false;setWho();
    if(!location.hash||!VIEWS.includes(location.hash.slice(1)))location.hash="#cotizar";render();
    clearInterval(pollT);pollT=setInterval(()=>{if(document.visibilityState==="visible"&&state.mode==="sheets")cargarNube(false).catch(()=>{});},30000);}
  else{if(!isAdmin()&&!["cotizar","cotizaciones"].includes(currentView()))location.hash="#cotizar";setWho();if(!settingsDirty)settingsDraft=null;refreshFromData();}
}
async function reserveNumero(){const r=await api("reservarNumero");const n=parseInt(String(r.numero).replace(/\D/g,""),10)||0;contador=Math.max(contador,n);return r.numero;}
async function apiPersist(kind,obj,del){
  const coll={cliente:"clientes",cotizacion:"cotizaciones"}[kind];
  try{
    if(kind==="ajustes"){await api("guardarAjustes",{dato:clone(obj)});state.settings=clone(obj);return true;}
    if(del){await api(kind==="cliente"?"borrarCliente":"borrarCotizacion",{id:obj.id});applyLocal(kind,obj,true,coll);return true;}
    const r=await api(kind==="cliente"?"guardarCliente":"guardarCotizacion",{dato:clone(obj)});
    const s=r.dato||obj;obj.ownerUid=s.ownerUid;obj.ownerNombre=s.ownerNombre;applyLocal(kind,s,false,coll);return true;
  }catch(e){toast("No se pudo guardar: "+apiErr(e));return false;}
}

/* ---------- Pantallas de entrada ---------- */
function gateShell(title,lede,body,wide){
  return `<section class="panel gate${wide?" wide":""}"><svg viewBox="-50 -50 100 100" aria-hidden="true" class="gate-emb"><use href="#tc-emblem"/></svg>
    <h1>${title}</h1>${lede?`<p class="muted">${lede}</p>`:""}${body}
    <svg class="wave" viewBox="0 0 400 50" preserveAspectRatio="none" aria-hidden="true" style="width:calc(100% + 36px);margin:20px -18px -18px"><path d="M0,20 C70,0 150,6 215,28 C275,46 340,40 400,16 V50 H0 Z" fill="var(--orange)"/><path d="M0,42 C90,30 165,24 235,35 C305,46 355,30 400,24 V50 H0 Z" fill="var(--amber)"/></svg></section>`;}
function renderAuthGate(){
  $$("#nav a").forEach(a=>a.setAttribute("aria-current","false"));setWho();
  const app=$("#app");app.onclick=null;app.oninput=null;app.onchange=null;app.onpointerdown=null;
  const g=gate.paso;
  if(g==="cargando"){app.innerHTML=gateShell("Cargando","Conectando con Google Sheets…","");return;}
  if(g==="error"){app.innerHTML=gateShell("No se pudo conectar",esc(gate.msg||""),`<div class="btns"><button class="btn primary" type="button" id="gRe">Reintentar</button><button class="btn ghost" type="button" id="gCfg">Cambiar la dirección de la base de datos</button></div>`);
    $("#gRe").onclick=()=>location.reload();$("#gCfg").onclick=()=>{gate={paso:"config"};render();};return;}
  if(g==="config")return renderSetupConfig();
  if(g==="admin")return renderSetupAdmin();
  return renderLoginSheets();
}
function renderSetupConfig(){
  const app=$("#app");
  app.innerHTML=gateShell("Conectar con Google Sheets","Este paso se hace una sola vez. Pega la dirección de la aplicación web que publicaste desde la hoja de cálculo.",`
    ${gate.msg?`<p class="err">${esc(gate.msg)}</p>`:""}
    <label class="f"><span>Dirección de la aplicación web</span><input id="apiTxt" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"><span class="hint">Termina en /exec. La encuentras en Apps Script, Implementar, Gestionar implementaciones.</span></label>
    <div class="err" id="apiErr" role="alert"></div>
    <div class="btns" style="margin-top:12px"><button class="btn primary" type="button" id="apiOk">Probar y conectar</button></div>
    <div id="apiOut"></div>`,true);
  $("#apiOk").onclick=async()=>{const v=$("#apiTxt").value.trim();const err=$("#apiErr");err.textContent="";
    if(!URL_OK.test(v)){err.textContent="La dirección debe empezar por https://script.google.com/macros/s/ y terminar en /exec.";return;}
    nube=v;const b=$("#apiOk");b.disabled=true;
    try{await api("estado",{},false);}catch(x){b.disabled=false;nube=null;err.textContent=apiErr(x);return;}
    try{localStorage.setItem("tc_api",v);}catch(e){}
    const file=`// Dirección de la base de datos (Google Sheets) de Tercio Creativo\nwindow.TERCIO_API = "${v}";\n`;
    $("#apiOut").innerHTML=`<div class="okbox"><b>La conexión funciona y este navegador ya quedó conectado.</b> Para que todos los equipos queden conectados sin repetir este paso, reemplaza el contenido del archivo <code>api-config.js</code> en GitHub por este texto:
      <textarea readonly rows="3" id="cfgFile">${esc(file)}</textarea><div class="btns"><button class="btn sm" type="button" id="cfgCopy">Copiar texto</button><button class="btn sm primary" type="button" id="cfgGo">Continuar</button></div></div>`;
    $("#cfgCopy").onclick=async()=>{try{await navigator.clipboard.writeText(file);toast("Texto copiado");}catch(e){$("#cfgFile").select();document.execCommand("copy");toast("Texto copiado");}};
    $("#cfgGo").onclick=()=>location.reload();};
}
function renderSetupAdmin(){
  const app=$("#app");const E=DEFAULTS.empresa;
  app.innerHTML=gateShell("Configuración inicial","Crea la cuenta del administrador y los datos de la empresa. Este paso aparece una sola vez.",`
    <form id="adF" novalidate>
      <h3>Datos de la empresa</h3>
      <div class="grid wide">
        <label class="f req"><span>Razón social</span><input name="emp" value="${esc(E.nombre)}"></label>

        <label class="f"><span>Dirección</span><input name="dir"></label>
        <label class="f"><span>Ciudad</span><input name="ciu" value="${esc(E.ciudad)}"></label>
        <label class="f"><span>Teléfono</span><input name="tel" inputmode="tel"></label>

      <h3 style="margin-top:18px">Administrador</h3>
      <div class="grid wide">
        <label class="f req"><span>Nombre completo</span><input name="nom" autocomplete="name"></label>
        <label class="f req"><span>Correo (será el usuario)</span><input name="email" type="email" autocomplete="username"></label>
        <label class="f req"><span>Contraseña</span><input name="p1" type="password" autocomplete="new-password"><span class="hint">Mínimo 6 caracteres</span></label>
        <label class="f req"><span>Repite la contraseña</span><input name="p2" type="password" autocomplete="new-password"></label></div>
      <div class="err" id="adErr" role="alert"></div>

  $("#adF").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const g=k=>String(f.get(k)||"").trim();const err=$("#adErr");err.textContent="";
    const miss=[];if(!g("emp"))miss.push("razón social");if(!g("nom"))miss.push("nombre");if(!g("email"))miss.push("correo");if(g("p1").length<6)miss.push("contraseña de 6 o más caracteres");
    if(miss.length){err.textContent="Falta: "+miss.join(", ")+".";return;}if(g("p1")!==g("p2")){err.textContent="Las contraseñas no coinciden.";return;}
    const btn=e.target.querySelector("[type=submit]");btn.disabled=true;
    const S=clone(DEFAULTS);Object.assign(S.empresa,{nombre:g("emp"),nit:g("nit"),direccion:g("dir"),ciudad:g("ciu"),telefono:g("tel"),correo:g("cor")});
    try{const r=await api("setup",{admin:{nombre:g("nom"),email:g("email"),pass:g("p1")},ajustes:S},false);setToken(r.token);toast("Administrador creado");await cargarNube(true);}
    catch(x){btn.disabled=false;err.textContent=apiErr(x);}};
}
function renderLoginSheets(){
  const app=$("#app");
  app.innerHTML=gateShell(esc(publico&&publico.empresa||"Tercio Creativo"),"Ingresa con el correo y la contraseña que te dio el administrador.",`
    <form id="lgF" class="grid" style="grid-template-columns:1fr" novalidate>
      ${gate.msg?`<p class="err" style="margin:0">${esc(gate.msg)}</p>`:""}
      <label class="f"><span>Correo</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="f"><span>Contraseña</span><input type="password" name="pass" autocomplete="current-password" required></label>
      <div class="err" id="lgErr" role="alert"></div>
      <button class="btn primary" type="submit">Ingresar</button>
      <p class="small muted" style="margin:0">¿Olvidaste la contraseña? Pídele al administrador que te asigne una nueva desde Usuarios.</p></form>`);
  $("#lgF").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const btn=e.target.querySelector("[type=submit]");btn.disabled=true;$("#lgErr").textContent="";
    try{const r=await api("login",{email:String(f.get("email")).trim(),pass:String(f.get("pass"))},false);setToken(r.token);gate={paso:"cargando"};render();await cargarNube(true);}
    catch(x){gate={paso:"login"};if($("#lgErr")){$("#lgErr").textContent=apiErr(x);btn.disabled=false;}else{render();toast(apiErr(x));}}};
}
function openPwdDialog(){
  const dlg=$("#dlg");
  dlg.innerHTML=`<form id="pwF" novalidate><div class="dlg-h"><h2 style="margin:0">Cambiar mi contraseña</h2><button class="btn ghost sm" type="button" id="pwX">Cerrar</button></div>

      <label class="f"><span>Repite la nueva</span><input name="n2" type="password" autocomplete="new-password"></label></div>
      <div class="err" id="pwErr" role="alert"></div></div>
    <div class="dlg-f"><button class="btn primary" type="submit">Guardar</button></div></form>`;
  dlg.showModal();dlg.onchange=null;dlg.oninput=null;

    if(f.get("n1")!==f.get("n2")){err.textContent="Las contraseñas nuevas no coinciden.";return;}

/* ---------- Usuarios (solo administradores) ---------- */
function renderUsuarios(){
  const list=(state.usuarios||[]).slice().sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""));
  $("#app").innerHTML=`<div class="head"><div><h1>Usuarios</h1><p class="lede">Los administradores ven todo. Los empleados entran a Cotizar y a Cotizaciones para atender a los clientes, sin ver costos internos, márgenes ni ajustes.</p></div></div>
  <section class="panel"><h2>Crear usuario</h2>
    <form id="uF" novalidate><div class="grid wide">
      <label class="f req"><span>Nombre completo</span><input name="nom"></label>
      <label class="f req"><span>Correo (será el usuario)</span><input name="email" type="email" autocomplete="off"></label>
      <label class="f req"><span>Contraseña inicial</span><input name="pass" type="text" autocomplete="off"><span class="hint">Mínimo 6 caracteres. Entrégasela a la persona.</span></label>
      <label class="f"><span>Teléfono</span><input name="tel" inputmode="tel"></label>
      <label class="f req"><span>Rol</span><select name="rol"><option value="empleado">Empleado: Cotizar y Cotizaciones</option><option value="admin">Administrador: acceso a todo</option></select></label></div>
      <div class="err" id="uErr" role="alert"></div>
      <button class="btn primary" type="submit" style="margin-top:12px">Crear usuario</button></form></section>
  <section class="panel"><h2>Usuarios registrados</h2>
    ${list.length?`<div class="tw"><table class="t"><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Acceso</th><th></th></tr></thead><tbody>
    ${list.map(u=>{const yo=perfil&&u.id===perfil.id;return`<tr><td><b>${esc(u.nombre)}</b>${u.telefono?`<div class="small muted">${esc(u.telefono)}</div>`:""}</td><td>${esc(u.email)}</td>
      <td><select class="st" data-urol="${esc(u.id)}" ${yo?"disabled":""}><option value="empleado" ${u.rol!=="admin"?"selected":""}>Empleado</option><option value="admin" ${u.rol==="admin"?"selected":""}>Administrador</option></select></td>
      <td><label class="check small"><input type="checkbox" data-uact="${esc(u.id)}" ${u.activo?"checked":""} ${yo?"disabled":""}> Activo</label></td>
      <td class="r">${yo?`<span class="small muted">Tú</span>`:`<button class="btn sm ghost" type="button" data-urst="${esc(u.id)}" data-unom="${esc(u.nombre)}">Asignar contraseña nueva</button>`}</td></tr>`;}).join("")}
    </tbody></table></div>`:`<div class="empty"><b>No hay usuarios todavía</b></div>`}
    <p class="small muted">Para quitarle el acceso a alguien, desmarca Activo: no podrá entrar aunque conozca su contraseña. Los usuarios quedan en la pestaña Usuarios de la hoja de cálculo; las contraseñas se guardan cifradas.</p></section>`;
  const app=$("#app");app.oninput=null;
  $("#uF").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const g=k=>String(f.get(k)||"").trim();const err=$("#uErr");err.textContent="";
    if(!g("nom")||!g("email")){err.textContent="Falta el nombre o el correo.";return;}if(g("pass").length<6){err.textContent="La contraseña debe tener al menos 6 caracteres.";return;}
    const btn=e.target.querySelector("[type=submit]");btn.disabled=true;
    try{const r=await api("crearUsuario",{nombre:g("nom"),email:g("email"),pass:g("pass"),telefono:g("tel"),rol:g("rol")});

  app.onchange=async e=>{const t=e.target;
    try{if(t.dataset.urol){await api("actualizarUsuario",{id:t.dataset.urol,rol:t.value});upd(t.dataset.urol,{rol:t.value});toast("Rol actualizado");}
      if(t.dataset.uact){await api("actualizarUsuario",{id:t.dataset.uact,activo:t.checked});upd(t.dataset.uact,{activo:t.checked});toast(t.checked?"Acceso activado":"Acceso desactivado");}
    }catch(x){toast(apiErr(x));renderUsuarios();}};
  app.onclick=async e=>{const b=e.target.closest("button");if(!b||!b.dataset.urst)return;

}
